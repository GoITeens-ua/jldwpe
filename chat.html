<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Чат-симулятор | Happy Kids 11–13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #0F172A;
    --chat-bg: #1E293B;
    --header-bg: #0F172A;
    --incoming-bubble: #334155;
    --outgoing-bubble: #4F46E5;
    --text-primary: #F8FAFC;
    --text-muted: #94A3B8;
    --accent: #FEC830;
    --coral: #EF4444;
    --teal: #10B981;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-page);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .phone-frame {
    width: 100%;
    max-width: 440px;
    height: 100vh;
    max-height: 860px;
    background: var(--chat-bg);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  @media(min-width: 500px) {
    .phone-frame {
      height: 90vh;
      border-radius: 36px;
      border: 6px solid #334155;
    }
  }

  /* Шапка месенджера */
  .chat-header {
    background: var(--header-bg);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    z-index: 10;
  }
  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #3B82F6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .chat-info { flex: 1; }
  .chat-title { font-size: 0.95rem; font-weight: 700; }
  .chat-status { font-size: 0.78rem; color: var(--teal); font-weight: 500; }

  /* Стрічка повідомлень */
  .messages-flow {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  .msg-row {
    display: flex;
    flex-direction: column;
    animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .msg-row.incoming { align-items: flex-start; }
  .msg-row.outgoing { align-items: flex-end; }

  .bubble {
    max-width: 84%;
    padding: 12px 16px;
    font-size: 0.92rem;
    line-height: 1.45;
    position: relative;
    word-break: break-word;
  }
  .msg-row.incoming .bubble {
    background: var(--incoming-bubble);
    color: #F8FAFC;
    border-radius: 18px 18px 18px 4px;
  }
  .msg-row.outgoing .bubble {
    background: var(--outgoing-bubble);
    color: #FFFFFF;
    border-radius: 18px 18px 4px 18px;
  }
  .time-stamp {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.45);
    margin-top: 4px;
    align-self: flex-end;
  }

  /* Анімація набору тексту */
  .typing-indicator {
    display: none;
    align-items: center;
    gap: 5px;
    background: var(--incoming-bubble);
    padding: 10px 16px;
    border-radius: 18px 18px 18px 4px;
    width: fit-content;
  }
  .typing-dot {
    width: 6px;
    height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Шторка вибору відповідей (замість клавіатури) */
  .replies-tray {
    background: #0F172A;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding: 14px 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tray-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 2px;
    display: flex;
    justify-content: space-between;
  }
  .reply-option-btn {
    background: #1E293B;
    border: 1.5px solid #334155;
    border-radius: 14px;
    padding: 11px 14px;
    color: #F8FAFC;
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    line-height: 1.35;
    transition: all 0.15s ease;
  }
  .reply-option-btn:hover {
    background: #334155;
    border-color: #64748B;
    transform: translateY(-1px);
  }
  .reply-option-btn:active { transform: translateY(1px); }

  /* Карточка аналізу */
  .verdict-sheet {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.94);
    backdrop-filter: blur(8px);
    z-index: 30;
    padding: 24px;
    flex-direction: column;
    justify-content: center;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .verdict-box {
    background: #1E293B;
    border: 2px solid #475569;
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
  }
  .verdict-pill {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .btn-continue {
    width: 100%;
    margin-top: 18px;
    background: var(--accent);
    color: #0F172A;
    border: none;
    border-radius: 14px;
    padding: 13px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: 0.15s;
  }
  .btn-continue:hover { filter: brightness(1.08); }
</style>
</head>
<body>

<div class="phone-frame">
  <!-- Шапка -->
  <div class="chat-header">
    <div class="avatar" id="authorAvatar">🎮</div>
    <div class="chat-info">
      <div class="chat-title" id="chatName">Сквад #катка</div>
      <div class="chat-status" id="authorStatus">онлайн</div>
    </div>
    <span style="font-size:0.75rem; color:var(--text-muted); font-weight:700;" id="caseCounter">1 / 2</span>
  </div>

  <!-- Повідомлення -->
  <div class="messages-flow" id="flow">
    <!-- Початкове вкидання генерується скриптом -->
    <div class="typing-indicator" id="typing">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  </div>

  <!-- Шторка варіантів -->
  <div class="replies-tray" id="tray">
    <div class="tray-title">
      <span>Твоя відповідь</span>
      <span>Обери репліку 💬</span>
    </div>
    <div id="optionsWrap" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>

  <!-- Підсумок / Фідбек -->
  <div class="verdict-sheet" id="verdictModal">
    <div class="verdict-box">
      <span class="verdict-pill" id="vPill">Аналіз</span>
      <h3 id="vTitle" style="font-size:1.2rem; margin-bottom:8px;">Що відбулося в чаті?</h3>
      <p id="vDesc" style="font-size:0.9rem; color:#CBD5E1; line-height:1.5; margin-bottom:12px;"></p>
      <div id="vTip" style="background:#0F172A; padding:12px; border-radius:12px; font-size:0.85rem; line-height:1.45;"></div>
      <button class="btn-continue" id="vBtn" onclick="nextCase()">Далі →</button>
    </div>
  </div>
</div>

<script>
  const cases = [
    {
      name: "Сквад #катка",
      avatar: "🎮",
      incoming: "Ти все заруїнив(-ла) в останньому раунді! 🤬 Краще б ти взагалі лівнув(-ла) перед початком!",
      options: [
        {
          text: "Сам ти дно косоруке! Глянь на свій рахунок спочатку, а потім вякай! 🤡",
          botReply: "Ахаха, згорів, нубас! Лівай зі скваду, ми тебе кикаємо назавжди.",
          type: "danger",
          label: "Атака (Режим Бий)",
          title: "🔥 Ескалація конфлікту",
          desc: "Ти відповів наїздом на наїзд. Тепер діалог скотився у взаємні образи перед усіма, гра зіпсована, а тебе просто викинули з команди.",
          tip: "💡 <b>Пастка:</b> атака у відповідь змушує іншого захищатися ще жорсткіше. Градус сварки злітає до 100%."
        },
        {
          text: "Ой вибачте, що образив ваше величне вміння грати... Великий про-гравець знайшовся.",
          botReply: "Ти мені тут не язви. Якщо грати не вмієш — хоча б мовчи в тряпочку.",
          type: "warning",
          label: "Пасивна агресія",
          title: "⚠️ Прихована отрута",
          desc: "Сарказм здається дотепним захистом, але співрозмовник зчитує його як прихований укол і розпалюється ще сильніше.",
          tip: "💡 <b>Пастка:</b> пасивна агресія ніколи не розв'язує проблему, вона лише подовжує токсичну перепалку."
        },
        {
          text: "Раунд справді вийшов невдалим, я сам незадоволений. Але розмовляти зі мною в такому тоні не треба. Зіграємо пізніше, коли всі охолонуть.",
          botReply: "Ладно... вибач, згорів через злитий ранг. Давай через 15 хв перекуримо.",
          type: "success",
          label: "Режим сили",
          title: "🛡️ Повна нейтралізація",
          desc: "Ти визнав факт помилки без самоприниження, виставив жорстку межу на крик («в такому тоні не треба») і взяв паузу.",
          tip: "💡 <b>Сила:</b> у такій відповіді немає зачіпок для нової агресії. Тіммейт змушений пригасити свій тон."
        }
      ]
    },
    {
      name: "7-Б клас (26)",
      avatar: "💬",
      incoming: "Ахах, ти реально таке запитав(-ла) у вчителя? 😂 Рівень крінжу зашкалює, чисто перший клас))",
      options: [
        {
          text: "Завали пельку, найрозумніший тут? Слідкуй за своїми оцінками краще.",
          botReply: "Ого як підгоріло 😂 Народ, дивіться як рветься!",
          type: "danger",
          label: "Атака (Режим Бий)",
          title: "🔥 Публічна пастка",
          desc: "Ти подарував провокатору саме ту реакцію, якої він чекав. Тепер весь клас дивиться на твоє обурення як на шоу.",
          tip: "💡 <b>Пастка:</b> хейтери в чатах живляться твоєю істерикою. Не годуй їх."
        },
        {
          text: "Я запитую те, що мені потрібно зрозуміти перед тестом. А твої дешеві підколки мені не цікаві.",
          botReply: "Та ладно, я ж просто пожартував, чого ти одразу...",
          type: "success",
          label: "Режим сили",
          title: "🛡️ Доросла гідність",
          desc: "Ти спокійно захистив(-ла) своє право питати і прямо, без мату та крику, назвав(-ла) його жарти дешевими. Він одразу здав назад («та я просто пожартував»).",
          tip: "💡 <b>Сила:</b> спокійна впевненість миттєво знецінює будь-яку насмішку."
        },
        {
          text: "Та роби шо хочеш, мені абсолютно байдуже на тебе й твою думку.",
          botReply: "Було б байдуже — не виправдовувався(-лася) б тут))",
          type: "warning",
          label: "Маска байдужості",
          title: "⚠️ Непереконливий захист",
          desc: "Коли людина пише довге повідомлення про те, як їй «пофіг», усі в чаті розуміють: її зачепило за живе.",
          tip: "💡 <b>Пастка:</b> фраза «мені байдуже» майже завжди виглядає як спроба сховати образу."
        }
      ]
    }
  ];

  let curIdx = 0;

  function loadCase(idx) {
    const c = cases[idx];
    document.getElementById('chatName').textContent = c.name;
    document.getElementById('authorAvatar').textContent = c.avatar;
    document.getElementById('caseCounter').textContent = `${idx + 1} / ${cases.length}`;
    
    // Очистити чат
    const flow = document.getElementById('flow');
    flow.querySelectorAll('.msg-row').forEach(m => m.remove());

    // Додати вхідне повідомлення
    addIncoming(c.incoming);

    // Згенерувати варіанти
    const wrap = document.getElementById('optionsWrap');
    wrap.innerHTML = '';
    c.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'reply-option-btn';
      btn.textContent = opt.text;
      btn.onclick = () => sendReply(opt);
      wrap.appendChild(btn);
    });

    document.getElementById('tray').style.display = 'flex';
  }

  function addIncoming(text) {
    const flow = document.getElementById('flow');
    const typing = document.getElementById('typing');
    const row = document.createElement('div');
    row.className = 'msg-row incoming';
    row.innerHTML = `
      <div class="bubble">${text}</div>
      <span class="time-stamp">Щойно</span>
    `;
    flow.insertBefore(row, typing);
    flow.scrollTop = flow.scrollHeight;
  }

  function sendReply(opt) {
    document.getElementById('tray').style.display = 'none';

    // Відправка репліки гравця
    const flow = document.getElementById('flow');
    const typing = document.getElementById('typing');
    const row = document.createElement('div');
    row.className = 'msg-row outgoing';
    row.innerHTML = `
      <div class="bubble">${opt.text}</div>
      <span class="time-stamp">Щойно ✓✓</span>
    `;
    flow.insertBefore(row, typing);
    flow.scrollTop = flow.scrollHeight;

    // Вмикаємо "друкує..."
    setTimeout(() => {
      typing.style.display = 'flex';
      flow.scrollTop = flow.scrollHeight;

      // Відповідь бота
      setTimeout(() => {
        typing.style.display = 'none';
        addIncoming(opt.botReply);

        // Показ картки розбору
        setTimeout(() => {
          showVerdict(opt);
        }, 1100);
      }, 1400);
    }, 400);
  }

  function showVerdict(opt) {
    const modal = document.getElementById('verdictModal');
    const pill = document.getElementById('vPill');
    pill.textContent = opt.label;
    if (opt.type === 'danger') {
      pill.style.background = '#EF4444';
      pill.style.color = '#fff';
    } else if (opt.type === 'warning') {
      pill.style.background = '#FEC830';
      pill.style.color = '#000';
    } else {
      pill.style.background = '#10B981';
      pill.style.color = '#fff';
    }

    document.getElementById('vTitle').textContent = opt.title;
    document.getElementById('vDesc').textContent = opt.desc;
    document.getElementById('vTip').innerHTML = opt.tip;

    modal.style.display = 'flex';
  }

  function nextCase() {
    document.getElementById('verdictModal').style.display = 'none';
    curIdx++;
    if (curIdx < cases.length) {
      loadCase(curIdx);
    } else {
      alert('🎉 Всі діалоги пройдено! Ти побачив(-ла), як одна фраза може змінити хід розмови.');
      curIdx = 0;
      loadCase(0);
    }
  }

  loadCase(0);
</script>
</body>
</html>
